[project]
name = "agenticrag-kb-webui-backend"
version = "0.2.0"
description = "FastAPI backend for an AgenticRAG multi-format knowledge base WebUI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.125.0",
  "uvicorn[standard]>=0.40.0",
  "pydantic>=2.13.0",
  "pydantic-settings>=2.14.0",
  "python-dotenv>=1.2.0",
  "openai>=2.36.0",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  # 第二阶段新增
  "sentence-transformers>=3.0.0",
  "chromadb>=0.6.0",
  "networkx>=3.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.0",
  "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
include = ["kb_web_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
